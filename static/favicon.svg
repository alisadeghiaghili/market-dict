<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Border Glow -->
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>

  <!-- Candlestick 1 (Left Bullish Bar) -->
  <line x1="20" y1="24" x2="20" y2="44" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <rect x="17" y="28" width="6" height="12" rx="1.5" fill="#ffffff"/>

  <!-- Candlestick 2 (Middle Bullish High Bar) -->
  <line x1="32" y1="16" x2="32" y2="44" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
  <rect x="29" y="20" width="6" height="18" rx="1.5" fill="url(#goldGrad)"/>

  <!-- Candlestick 3 (Right High Trend Bar) -->
  <line x1="44" y1="12" x2="44" y2="40" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <rect x="41" y="15" width="6" height="16" rx="1.5" fill="#ffffff"/>

  <!-- Dictionary Open Book Base -->
  <path d="M14 48 C 22 45, 28 47, 32 50 C 36 47, 42 45, 50 48" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Trend Indicator Arrow -->
  <path d="M22 34 L 32 24 L 38 30 L 48 18" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="43,18 48,18 48,23" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
