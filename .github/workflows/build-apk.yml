name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-apk.yml'
      - 'templates/**'
      - 'static/**'
      - 'bilingual_dictionary.json'
      - 'build_static.py'
      - 'package.json'
      - 'capacitor.config.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Static Site
        run: |
          python build_static.py

      - name: Install NPM Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Add Android Platform
        run: |
          npx cap add android

      - name: Generate Android App Icons from SVG
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin

          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          # Render MarketDict favicon.svg into each Android mipmap density
          rsvg-convert -w 48 -h 48 static/favicon.svg -o android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          rsvg-convert -w 48 -h 48 static/favicon.svg -o android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          rsvg-convert -w 108 -h 108 static/favicon.svg -o android/app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png

          rsvg-convert -w 72 -h 72 static/favicon.svg -o android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          rsvg-convert -w 72 -h 72 static/favicon.svg -o android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          rsvg-convert -w 162 -h 162 static/favicon.svg -o android/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png

          rsvg-convert -w 96 -h 96 static/favicon.svg -o android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          rsvg-convert -w 96 -h 96 static/favicon.svg -o android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          rsvg-convert -w 216 -h 216 static/favicon.svg -o android/app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png

          rsvg-convert -w 144 -h 144 static/favicon.svg -o android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          rsvg-convert -w 144 -h 144 static/favicon.svg -o android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          rsvg-convert -w 324 -h 324 static/favicon.svg -o android/app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png

          rsvg-convert -w 192 -h 192 static/favicon.svg -o android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          rsvg-convert -w 192 -h 192 static/favicon.svg -o android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          rsvg-convert -w 432 -h 432 static/favicon.svg -o android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png

          mkdir -p android/app/src/main/res/drawable
          cat << 'EOF' > android/app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#047857"
                  android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF

      - name: Configure Android Manifest for Offline TTS & Visibility
        run: |
          python -c "
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r', encoding='utf-8') as f:
              content = f.read()
          if '<queries>' not in content:
              queries = '''    <queries>
                  <intent>
                      <action android:name=\"android.intent.action.TTS_SERVICE\" />
                  </intent>
              </queries>
          </manifest>'''
              content = content.replace('</manifest>', queries)
              with open(manifest_path, 'w', encoding='utf-8') as f:
                  f.write(content)
          print('Successfully injected TTS queries intent into AndroidManifest.xml')
          "

      - name: Build APK (With GitHub Button)
        run: |
          python build_static.py
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk MarketDict-with-github.apk
          cp MarketDict-with-github.apk MarketDict.apk
          ls -lh MarketDict-with-github.apk

      - name: Build APK (Without GitHub Button)
        run: |
          python build_static.py --no-github
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk MarketDict-no-github.apk
          ls -lh MarketDict-no-github.apk

      - name: Upload APKs as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarketDict-APK-Binaries
          path: |
            MarketDict.apk
            MarketDict-with-github.apk
            MarketDict-no-github.apk
          retention-days: 30

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch'
        with:
          tag_name: apk-latest
          name: "MarketDict APK Release"
          body: "Official Android APK binaries for MarketDict with offline Persian/English speech, KaTeX formulas, and custom builds."
          draft: false
          prerelease: false
          files: |
            MarketDict.apk
            MarketDict-with-github.apk
            MarketDict-no-github.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
