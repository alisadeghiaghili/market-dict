name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-apk.yml'
      - 'templates/**'
      - 'static/**'
      - 'bilingual_dictionary.json'
      - 'build_static.py'
      - 'package.json'
      - 'capacitor.config.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Static Site
        run: |
          python build_static.py

      - name: Install NPM Dependencies
        run: |
          npm install

      - name: Add Android Platform
        run: |
          npx cap add android

      - name: Sync Web Assets to Android
        run: |
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cd ..

      - name: Copy Output APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MarketDict.apk
          ls -lh MarketDict.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarketDict-APK
          path: MarketDict.apk
          retention-days: 30

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch'
        with:
          tag_name: apk-latest
          name: "MarketDict APK Release"
          body: "Direct download of MarketDict bilingual offline Android app."
          draft: false
          prerelease: false
          files: MarketDict.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
